
title: GCP VM Logging Made Easy
date: '2025-12-10'
excerpt: How to setup logging on GCP VMs using Google Cloud's Ops Agent
content: |
  # GCP VM Logging Made Easy

  I have to admit, lately I've been deploying an application to a VM, not to Kubernetes as I'm usually accustomed to. As someone who spends a lot of time in containerized environments, setting up logging on a traditional VM felt like a step back, and I anticipated a lot of manual effort. I knew about Google Cloud's Ops Agent, having installed it on VMs in the past, but I had never really delved into configuring it myself. I always assumed that was where the real complexity would lie. Boy, was I wrong! I finally decided to dive in, and I’m genuinely excited by how incredibly simple Google Cloud has made it to not just install, but also configure for effective logging. 🎉

  ## The Magic Bullet: Google Cloud's Ops Agent

  The core of this simplicity is the **Ops Agent**. This isn't just another logging agent; it's a unified solution that collects both logs and metrics from your VMs. What's really cool is that under the hood, it leverages open-source projects: Fluent Bit for logging and OpenTelemetry (OTEL) for meCtrics. The installation is straight forward:

  ```bash
  curl -sSO https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
  sudo bash add-google-cloud-ops-agent-repo.sh --also-install
  ```

  The agent is installed and running. But make sure your VM's service account has the right IAM permissions to write to both the Logging API (`roles/logging.logWriter`) and the Monitoring API (`roles/monitoring.metricWriter`). I've learned this the hard way – if these permissions aren't set correctly, the Ops Agent can eventually cause the VM to become unresponsive and even inaccessible, requiring a full reset. So, **double-check those permissions!** ⚠️

  ## Configuring the Flow

  Okay, installation is easy and the configuration is the same. The Ops Agent is configured with a straightforward YAML file located at `/etc/google-cloud-ops-agent/config.yaml`.

  The structure is logical and easy to follow. It's broken down into three main parts:

  *   `receivers`: These define the sources of your logs. You can tail files, listen on a syslog port, and more.
  *   `processors`: Here, you can parse and transform your logs. For example, if you have JSON logs, you can tell the agent to parse them into structured data.
  *   `service`: This is where you connect your receivers and processors in a pipeline.

  ## A Real-World Example

  Let's make this concrete. Imagine I have a service called `payment-api` running on a VM. It writes JSON logs to `/var/log/payment-api.log`. This is the JSON log format we'll be working with:

  ```json
  {
    "timestamp": "2025-12-10T14:40:22Z",
    "service": "payment-api",
    "env": "production",
    "level": "INFO",
    "message": "Service started"
  }
  ```

  I want to get these logs into Google Cloud Logging, properly parsed. And to make our logs even more useful. Here is what the `config.yaml` looks like:

  ```yaml
  logging:
    receivers:
      # Setup receiver
      foo_app_receiver:
        type: files
        include_paths:
          - /var/log/payment-api.log
    processors:
      # Parse JSON so we have log attributes in Log Explorer
      json_processor:
        type: parse_json
      # Add custom labels to easy filtering
      add_custom_labels:
        type: modify_fields
        fields:
          labels.environment:
            move_from: "jsonPayload.env"
          labels.service:
            move_from: "jsonPayload.service"   
    # Join all together in a pipeline      
    service:
      pipelines:
        default_pipeline:
          receivers:
          - foo_app_receiver
          processors:
          - json_processor
          - add_custom_labels
  ```

  I've defined a receiver to tail my log file, a processor to parse the JSON, and a second processor to create a labels from payload properties. After restarting the agent, my logs started appearing in the Logs Explorer, perfectly structured, and with a filterable labels like: `labels.app="payment-api"`. After the Ops Agent processes your application log, this is how the corresponding entry would appear in Google Cloud Logging:

  ```json
  {
    "insertId": "1rkhymlf6zjf8a",
    "jsonPayload": {
      "timestamp": "2025-12-10T14:40:22Z",
      "level": "INFO",
      "message": "Service started"
    },
    "resource": {
      "type": "gce_instance",
      "labels": {
        "project_id": "************",
        "instance_id": "825277651178789986",
        "zone": "europe-west1-b"
      }
    },
    "timestamp": "2025-12-10T07:58:59.273176313Z",
    "labels": {
      "environment": "production",
      "service": "payment-api",
      "compute.googleapis.com/resource_name": "logging-post-demo"
    },
    "logName": "projects/************/logs/foo_app_receiver",
    "receiveTimestamp": "2025-12-10T07:58:59.551654741Z"
  }
  ```

  ## What if Something Goes Wrong? 🤔

  Troubleshooting is easy, if it's not working simply check the status of a service:

  ```bash
  sudo systemctl status google-cloud-ops-agent
  ```

  And the agent also writes its own logs `/var/log/google-cloud-ops-agent`, which you can inspect to see what's going on under the hood.

  ## It's Not Just About Logs! 📈

  And here's the kicker: the Ops Agent isn't limited to logging. You can also use it to collect a wide range of metrics from your VMs and applications and send them to Google Cloud Monitoring. This unified approach means less overhead and simpler management.

  ## Final Thoughts

  I'm genuinely impressed with the thought that has gone into the Ops Agent. It's a powerful and flexible tool that is also incredibly easy to get started with. If you’ve been putting off setting up proper observability for your GCP VMs because you thought it would be a hassle, I’m here to tell you: it’s not. Give it a try! 👍

